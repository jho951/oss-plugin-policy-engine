name: build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/src/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '**/gradle.properties'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - '**/src/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '**/gradle.properties'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: layer1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { gradle: '5.5.1', java: '8' }
          - { gradle: '6.9.4', java: '8' }
          - { gradle: '7.6.4', java: '8' }
          - { gradle: '8.14.3', java: '8' }
          - { gradle: '9.4.1', java: '21' }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        if: matrix.java != '8'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle clean check --no-daemon --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports-${{ matrix.gradle }}
          path: |
            **/build/reports/jacoco/test/
            **/build/reports/jacoco/test/html/
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
